[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sublylocal"
version = "0.1.0"
description = "Local-first video transcription, subtitle translation, and caption burning for humans and AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tony Pongo" }]
keywords = ["subtitles", "video", "whisper", "ollama", "ffmpeg", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "faster-whisper>=1.1.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
sublylocal = "sublylocal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sublylocal"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
